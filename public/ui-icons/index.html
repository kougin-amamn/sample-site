<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ユニバーサルデザイン アイコン集</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="head">
      <a class="back" href="../">← サンプル一覧</a>
      <h1>ユニバーサルデザイン アイコン集</h1>
      <p>
        年齢や言葉、見え方の違いにかかわらず意味が伝わることを目指した、ユニバーサルデザインの SVG
        アイコンです。アプリの操作部品に使えるよう、線の形だけで意味が伝わるように描いています。
      </p>
    </header>

    <div class="tools">
      <label class="search">
        <span class="sr">アイコンを探す</span>
        <input id="q" type="search" placeholder="名前や用途で探す(例: 電池、音量、wifi)" />
      </label>
      <div class="opts">
        <label
          >大きさ
          <select id="size">
            <option value="24">24px</option>
            <option value="32" selected>32px</option>
            <option value="48">48px</option>
            <option value="64">64px</option>
          </select>
        </label>
        <label
          >線の太さ <input id="stroke" type="range" min="1" max="3" step="0.25" value="2" /><output
            id="strokeOut"
            >2</output
          ></label
        >
        <label>色 <input id="color" type="color" value="#1f2a44" /></label>
      </div>
      <nav id="cats" class="cats" aria-label="分類"></nav>
    </div>

    <main id="list" class="list" aria-live="polite">
      <p id="status" class="status">読み込んでいます…</p>
    </main>

    <dialog id="detail" class="detail" aria-labelledby="dName">
      <form method="dialog" class="detail-close"><button aria-label="閉じる">×</button></form>
      <div class="detail-body">
        <div class="previews">
          <div id="dBig" class="pv pv-big"></div>
          <div class="pv-row">
            <div>
              <div id="d16" class="pv"></div>
              <small>16px</small>
            </div>
            <div>
              <div id="d24" class="pv"></div>
              <small>24px</small>
            </div>
            <div>
              <div id="d48" class="pv"></div>
              <small>48px</small>
            </div>
            <div class="pv-dark">
              <div id="dDark" class="pv"></div>
              <small>暗い背景</small>
            </div>
          </div>
        </div>
        <div class="info">
          <p id="dCat" class="d-cat"></p>
          <h2 id="dName"></h2>
          <p id="dDesc"></p>
          <p class="d-file">ファイル: <code id="dFile"></code></p>
          <div class="d-btns">
            <button id="dCopy" type="button">SVG をコピー</button>
            <button id="dSave" type="button">ダウンロード</button>
          </div>
          <p class="note">
            コピーとダウンロードには、今の線の太さが入ります。色は currentColor
            のままなので、使う側の文字色で変わります。
          </p>
          <pre id="dCode" class="code"></pre>
        </div>
      </div>
    </dialog>

    <script src="js/app.js"></script>
  </body>
</html>
