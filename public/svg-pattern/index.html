<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SVG 柄工房｜柄・パターンのサンプル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="toast-area" id="toastArea" aria-live="polite"></div>
<div class="wrap">
  <header>
    <a class="back" href="../">← サンプル一覧</a>
    <h1>SVG 柄工房</h1>
    <p>ドットやストライプから、青海波・鱗・七宝などの和柄まで。色や大きさを変えて、SVG・CSS・PNG で持ち帰れます。</p>
  </header>

  <div class="layout">
    <div>
      <div class="preview">
        <div class="preview-inner" id="preview"></div>
        <div class="preview-bar">
          <button class="btn" id="randomBtn">おまかせ</button>
          <button class="btn dark" id="dlSvg">SVGで保存</button>
          <button class="btn dark" id="dlPng">PNGで保存</button>
        </div>
      </div>
    </div>

    <div>
      <h2>調整</h2>
      <div class="field">
        <label for="size">大きさ <output id="sizeOut"></output></label>
        <input type="range" id="size" min="12" max="140" step="1">
      </div>
      <div class="field">
        <label for="weight">太さ <output id="weightOut"></output></label>
        <input type="range" id="weight" min="1" max="30" step="1">
      </div>
      <div class="field">
        <label for="rot">回転 <output id="rotOut"></output></label>
        <input type="range" id="rot" min="0" max="180" step="5">
      </div>
      <div class="field">
        <div class="colors">
          <label>柄 <input type="color" id="fg"></label>
          <label>地 <input type="color" id="bg"></label>
          <button class="btn ghost" id="swapBtn">入れ替え</button>
        </div>
        <div class="palettes" id="palettes"></div>
      </div>
    </div>
  </div>

  <h2 style="margin-top:32px">柄を選ぶ</h2>
  <div class="gallery" id="gallery" style="margin-top:0"></div>

  <section class="output">
    <h2>コード</h2>
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="svg" aria-selected="true">SVG</button>
      <button role="tab" data-tab="css" aria-selected="false">CSS の背景</button>
    </div>
    <pre><code id="code"></code></pre>
    <p class="note" id="note"></p>
    <div class="out-actions"><button class="btn ghost" id="copyBtn">コピー</button></div>
  </section>

  <footer>SVG は拡大しても荒れないので、背景・包装紙・名刺・スライドの飾りなどに使えます。</footer>
</div>

<script src="js/patterns.js"></script>
<script src="js/script.js"></script>
</body>
</html>
