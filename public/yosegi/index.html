<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>寄木模様帳</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="head">
      <a class="back" href="../">← サンプル一覧</a>
      <h1>寄木模様帳</h1>
      <p>箱根寄木細工の幾何学模様を、木目つきで Canvas に描いています</p>
    </header>
    <main class="layout">
      <section class="view">
        <div id="mode" class="mode" role="group" aria-label="描き方">
          <button type="button" data-mode="canvas" aria-pressed="true">Canvas</button>
          <button type="button" data-mode="svg" aria-pressed="false">SVG(feTurbulence)</button>
        </div>
        <canvas id="stage" aria-label="寄木の模様(Canvas)"></canvas>
        <svg id="stageSvg" class="stage-svg" role="img" aria-label="寄木の模様(SVG)" hidden></svg>
        <p id="status" class="status">読み込んでいます…</p>
      </section>
      <aside class="panel">
        <h2 id="pname">&nbsp;</h2>
        <p id="pdesc" class="desc"></p>
        <div id="patterns" class="patterns"></div>
        <div class="controls">
          <label class="row">
            <span>大きさ</span>
            <input id="size" type="range" min="20" max="90" value="44" />
            <output id="sizeOut">44</output>
          </label>
          <label class="row">
            <span>配色</span>
            <select id="preset"></select>
          </label>
          <label class="check"><input id="seam" type="checkbox" checked /> 木片の継ぎ目</label>
          <label class="check"><input id="gloss" type="checkbox" checked /> 塗装のつや</label>
          <button id="save" type="button" class="save">PNG で保存</button>
        </div>
        <h3>使っている木</h3>
        <ul id="legend" class="legend"></ul>
        <p class="note">
          木の名前は箱根でよく使われる樹種の例です。色と木目は写真ではなく計算で描いています。
        </p>
      </aside>
    </main>
    <script src="js/wood.js"></script>
    <script src="js/patterns.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/svg.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
